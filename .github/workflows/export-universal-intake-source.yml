name: Export universal intake source

on:
  push:
    branches: [universal-intake-dev]
    paths: [.github/workflows/export-universal-intake-source.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: git archive --format=zip --prefix=kairos-source/ -o kairos-source.zip HEAD
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: kairos-source
          path: kairos-source.zip
          if-no-files-found: error
